[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-llm-scanner"
version = "0.3.0"
description = "Local sensitive-data detection for Git repository scanning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "DISTRIBUTION_NOTICES.md", "licenses/*.txt"]
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "jsonschema[format]==4.26.0"]

[project.urls]
Homepage = "https://github.com/vovkins/ru-llm-scanner"
Documentation = "https://github.com/vovkins/ru-llm-scanner/tree/main/docs"
Issues = "https://github.com/vovkins/ru-llm-scanner/issues"

[project.scripts]
ru-llm-scanner = "ru_llm_scanner.cli:main"

[tool.setuptools.package-data]
ru_llm_scanner = ["report-v1.schema.json"]

[tool.setuptools.packages.find]
where = ["src"]
