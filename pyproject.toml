[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ru-llm-scanner"
version = "0.1.0.dev0"
description = "Local sensitive-data detection for Git repository scanning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]
